g:7px 5px}.on{color:var(--n)!important}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;padding:15px}.logo{width:58px;height:58px;border-radius:15px;background:var(--a);color:#fff;display:grid;place-items:center;font-size:23px;font-weight:900}.photo{width:100%;max-height:220px;object-fit:cover;border-radius:9px;margin-top:7px}.statusbar{height:7px;background:#edf1f4;border-radius:99px;overflow:hidden;margin:7px 0}.fill{height:100%;background:var(--g)}.timeline{display:grid;grid-template-columns:72px 1fr;gap:7px;margin-top:8px}.time{font-weight:800;color:var(--m);padding-top:9px}.booking{border:1px solid var(--l);border-left:5px solid var(--a);border-radius:10px;padding:9px}.booking.ready{border-left-color:var(--g)}.booking.work{border-left-color:var(--n)}.booking.wait{border-left-color:var(--a)}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:8px;border-bottom:1px solid var(--l);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--m)}.scroll{overflow:auto}.stickyActions{display:flex;gap:7px;flex-wrap:wrap}.compact h3{margin:0 0 6px}.moduleHero{border-radius:17px;padding:14px 15px;margin:8px 0 14px;border:1px solid var(--l)}.moduleHero h3{margin:0 0 3px}.moduleHero.jobs{background:var(--jobs-bg);border-left:6px solid var(--jobs-accent)}.moduleHero.calendar{background:var(--calendar-bg);border-left:6px solid var(--calendar-accent)}.moduleHero.tasks{background:var(--tasks-bg);border-left:6px solid var(--tasks-accent)}.moduleHero.super{background:var(--super-bg);border-left:6px solid var(--super-accent)}.moduleHero.products{background:var(--products-bg);border-left:6px solid var(--products-accent)}.moduleHero.board{background:var(--board-bg);border-left:6px solid var(--board-accent)}.sectionJobs{background:linear-gradient(180deg,var(--jobs-bg),#fff 180px);padding:10px;border-radius:18px}.sectionCalendar{background:linear-gradient(180deg,var(--calendar-bg),#fff 190px);padding:10px;border-radius:18px}.sectionTasks{background:linear-gradient(180deg,var(--tasks-bg),#fff 180px);padding:10px;border-radius:18px}.sectionSuper{background:linear-gradient(180deg,var(--super-bg),#fff 180px);padding:10px;border-radius:18px}.sectionBoard{background:linear-gradient(180deg,var(--board-bg),#fff 180px);padding:10px;border-radius:18px}.productPanel{background:var(--products-bg);border:1px solid #cfe3d7;border-radius:13px;padding:11px;margin-top:14px}.productPanel h3{color:var(--products-accent)}.cardTitleRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}.iconBubble{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-size:17px}.iconBubble.jobs{background:#d9eaf1}.iconBubble.calendar{background:#eee0ca}.iconBubble.tasks{background:#e7ddf1}.iconBubble.super{background:#dce7f1}.iconBubble.products{background:#dceee3}.nav button.on{background:#edf2f5;border-radius:9px}@media(max-width:650px){.g,.g3{grid-template-columns:1fr}.w{padding-top:12px}.table{min-width:760px}.stickyActions button{flex:1}}</style></head><body>
<div id=L class=login><div class=c style="width:min(440px,100%)"><div class=logo>KP</div><h2>Kone Pistemaa</h2><div class=mut>Testiversio v9 • selkeä teema</div><label>Käyttäjä</label><select id=R><option value=m>Mikko – Asentaja</option><option value=w>Sami – Työnjohto</option><option value=s>Janne – Esihenkilö</option></select><button class=p style="width:100%;margin-top:12px" onclick=login()>Kirjaudu</button></div></div>
<div id=A class=hide><div class=w><div class=row style="justify-content:space-between"><div><h2 id=T style="margin:0"></h2><div id=U class=mut></div></div><button class=s onclick=logout()>Ulos</button></div><div id=V></div></div><nav id=N class=nav></nav></div>
<script>
const K='kpv7',SE='kpv7r';let r='m',v='home';
const PRODUCTS=[{code:'TEST-001',name:'Moottoriöljy 5W-30',unit:'L'},{code:'TEST-002',name:'Öljynsuodatin',unit:'kpl'},{code:'TEST-003',name:'Ilmansuodatin',unit:'kpl'},{code:'TEST-004',name:'Jarrunpuhdistusaine',unit:'kpl'},{code:'TEST-005',name:'AdBlue-suodatin',unit:'kpl'},{code:'TEST-006',name:'Jarrupalasarja',unit:'sarja'}];
const seed={sh:{Mikko:['07:00','15:30'],Jari:['14:00','22:00'],Antti:['07:00','15:30'],Pekka:['07:00','15:30']},jobs:[{id:1,e:'Mikko',s:'08:00',f:'10:30',c:'Kuljetusliike Mallinen Oy',reg:'DKS-908',wo:'TM-26451',km:'',done:0,status:'work',st:[['S-huolto',0],['Jarrut',0],['Koeajo',0]],prod:[],pics:[]},{id:2,e:'Mikko',s:'11:00',f:'12:30',c:'Pohjolan Kuljetus Oy',reg:'CNR-151',wo:'TM-26452',km:'',done:0,status:'wait',st:[['Öljyvuodon tarkastus',0],['Korjaus',0]],prod:[],pics:[]},{id:3,e:'Jari',s:'14:30',f:'16:00',c:'Raskasliikenne Testi Oy',reg:'DRH-541',wo:'TM-26453',km:'245100',done:1,status:'ready',st:[['Jarruvika',1],['Koeajo',1]],prod:[{code:'TEST-006',name:'Jarrupalasarja',qty:1}],pics:[]}],tasks:[{id:1,t:'09:30',a:'Sami',x:'Tarkista varaosatoimitukset',d:0},{id:2,t:'10:00',a:'Sami',x:'Vastaa reklamaatioon',d:0,late:1},{id:3,t:'11:30',a:'Mikko',x:'Ota kuvat DKS-908 vauriosta ennen purkua',d:0},{id:4,t:'14:00',a:'Jari',x:'Tarkista koeajon jälkeen jarrulämpö',d:1}]};
let S=JSON.parse(localStorage.getItem(K)||'null')||seed;
function migrate(){S.sh=S.sh||seed.sh;S.jobs=S.jobs||[];S.tasks=S.tasks||[];['Mikko','Jari','Antti','Pekka'].forEach(e=>{if(!S.sh[e])S.sh[e]=seed.sh[e]});S.jobs.forEach(j=>{j.status=j.done?'ready':(j.status||'wait');j.prod=j.prod||[];j.pics=j.pics||[];j.st=j.st||[]});S.tasks.forEach(t=>{if(!t.a)t.a='Sami'});if(!S.jobs.some(j=>j.e==='Jari'))S.jobs.push(seed.jobs[2]);if(!S.tasks.some(t=>t.a==='Mikko'))S.tasks.push(seed.tasks[2]);if(!S.tasks.some(t=>t.a==='Jari'))S.tasks.push(seed.tasks[3]);save()}
const q=x=>document.querySelector(x),save=()=>localStorage.setItem(K,JSON.stringify(S)),min=t=>{let[a,b]=t.split(':').map(Number);return a*60+b},esc=x=>String(x??'').replace(/[&<>]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[a]));migrate();
function login(){r=q('#R').value;localStorage.setItem(SE,r);q('#L').classList.add('hide');q('#A').classList.remove('hide');v=r==='m'?'home':r==='w'?'board':'sup';build()}function logout(){localStorage.removeItem(SE);q('#A').classList.add('hide');q('#L').classList.remove('hide')}
function items(){return r==='m'?[['home','🏠 Etusivu'],['jobs','🔧 Työt'],['tasks','✅ Tehtävät']]:r==='w'?[['board','👥 Kaikki'],['plan','📋 Varaukset'],['tasks','✅ Tehtävät']]:[['sup','🛡️ Valvonta'],['board','👥 Kaikki'],['plan','📋 Varaukset'],['tasks','✅ Tehtävät']]}
function go(x){v=x;build()}function build(){q('#N').innerHTML=items().map(i=>`<button class="${v===i[0]?'on':''}" onclick="go('${i[0]}')">${i[1]}</button>`).join('');render()}function head(a,b){q('#T').textContent=a;q('#U').textContent=b;document.body.dataset.view=v}function render(){({home,jobs,tasks,plan,sup,board}[v]||home)()}
function statusTag(j){let st=j.done?'ready':j.status||'wait',txt=st==='work'?'Työn alla':st==='ready'?'Valmis':'Odottaa',cl=st==='ready'?'ok':st==='work'?'':'warn';return `<span class="tag ${cl}">${txt}</span>`}
function home(){head('Omat työt','Mikko • '+S.sh.Mikko[0]+'–'+S.sh.Mikko[1]);let js=S.jobs.filter(j=>j.e==='Mikko'),j=js.find(x=>!x.done)||js[0],mt=S.tasks.filter(t=>t.a==='Mikko'&&!t.d);q('#V').innerHTML=`<div class="moduleHero jobs"><h3>🔧 Asentajan työpäivä</h3><div class=mut>Työvuoro, seuraava työ ja omat tehtävät</div></div><div class=sectionJobs><div class=c><div class=mut>Seuraava työ</div><h3>${j.s}–${j.f} • ${j.reg}</h3><b>${j.c}</b><div class=row style="margin-top:6px"><span class=tag>${j.wo}</span>${statusTag(j)}</div><button class=p style="margin-top:10px" onclick="go('jobs')">Avaa työ</button></div><div class=c><h3>Omat tehtävät</h3>${mt.map(t=>`<div class=task><b>${t.t} • ${esc(t.x)}</b><button class=p style="margin-top:7px" onclick="td(${t.id})">Kuittaa</button></div>`).join('')||'<div class=mut>Ei avoimia tehtäviä</div>'}</div>`}
function jobs(){head('Varatut työt','Työmääräin, tuotteet, kuvat ja kuittaus');q('#V').innerHTML=`<div class="moduleHero jobs"><h3>🔧 Varatut työt</h3><div class=mut>Työmääräimet, työvaiheet, kuvat ja tuotteet</div></div><div class=sectionJobs>`+S.jobs.filter(j=>j.e==='Mikko').map(j=>`<div class=c><div class=row style="justify-content:space-between"><div><h3>${j.reg} • ${j.wo}</h3><div class=mut>${j.c} • ${j.s}–${j.f}</div></div>${statusTag(j)}</div>${!j.done&&j.status!=='work'?`<button class=a onclick="startjob(${j.id})">▶ Aloita työ</button>`:''}<label>Kilometrit *</label><input id=k${j.id} type=number value="${j.km||''}"><div>${j.st.map((x,i)=>`<label class=step><input type=checkbox ${x[1]?'checked':''} onchange="st(${j.id},${i},this.checked)"><b>${esc(x[0])}</b></label>`).join('')}</div><div class=row><input id=ns${j.id} placeholder="Lisää työvaihe"><button class=a onclick="addst(${j.id})">+ vaihe</button></div><h3 style="margin-top:16px">Myy tuote määräimelle</h3><label>Tuotehaku</label><div class=row><input id=ps${j.id} placeholder="Hae koodilla tai nimikkeellä"><button class=s onclick="psearch(${j.id})">🔎 Hae</button></div><div id=pr${j.id}></div><div class=g><div><label>Koodi</label><input id=pc${j.id}></div><div><label>Nimike</label><input id=pn${j.id}></div><div><label>Määrä</label><input id=pq${j.id} type=number value=1 step=.01></div><div style="align-self:end"><button class=p style="width:100%" onclick="prod(${j.id})">+ Myy</button></div></div><label>Kuva tuotteesta/pakkauksesta</label><input type=file accept="image/*" capture=environment onchange="ppic(${j.id},this)">${j.pp?`<img class=photo src="${j.pp}"><button class=a onclick="aid(${j.id})">✨ AI-tuoteavustus (demo)</button>`:''}<div>${(j.prod||[]).map(p=>`<div class=job><b>${esc(p.code||'–')} • ${esc(p.name)}</b><div>${p.qty} kpl</div></div>`).join('')}</div></div><h3>📷 Vauriokuvat</h3><input type=file accept="image/*" capture=environment onchange="pic(${j.id},this)">${(j.pics||[]).map(x=>`<img class=photo src="${x}">`).join('')}<button class=p style="width:100%;margin-top:12px" ${j.done?'disabled':''} onclick="finish(${j.id})">✓ Työ valmis</button></div>`).join('')}
function startjob(id){let j=S.jobs.find(x=>x.id===id);j.status='work';save();jobs()}function st(id,i,x){S.jobs.find(j=>j.id===id).st[i][1]=x?1:0;save();jobs()}function addst(id){let x=q('#ns'+id).value.trim();if(x){S.jobs.find(j=>j.id===id).st.push([x,0]);save();jobs()}}
function psearch(id){let term=(q('#ps'+id).value||'').trim().toLowerCase(),box=q('#pr'+id);let hits=PRODUCTS.filter(p=>p.code.toLowerCase().includes(term)||p.name.toLowerCase().includes(term));box.innerHTML=hits.length?hits.map(p=>`<div class=job onclick="psel(${id},'${p.code}','${p.name}')"><b>${p.code} • ${p.name}</b><div class=mut>${p.unit}</div></div>`).join(''):'<div class=mut>Ei löytynyt – syötä käsin.</div>'}function psel(id,c,n){q('#pc'+id).value=c;q('#pn'+id).value=n;q('#pr'+id).innerHTML=`<span class=tag>Valittu ${c}</span>`}function prod(id){let j=S.jobs.find(x=>x.id===id),code=q('#pc'+id).value.trim(),name=q('#pn'+id).value.trim(),qty=+q('#pq'+id).value;if((!code&&!name)||!qty)return alert('Täytä tuote ja määrä');j.prod.push({code,name:name||'Nimike tarkistettava',qty});save();jobs()}
function read(f,cb){let x=new FileReader;x.onload=()=>cb(x.result);x.readAsDataURL(f)}function ppic(id,i){let f=i.files[0];if(f)read(f,d=>{S.jobs.find(j=>j.id===id).pp=d;save();jobs()})}function pic(id,i){let f=i.files[0];if(f)read(f,d=>{S.jobs.find(j=>j.id===id).pics.push(d);save();jobs()})}function aid(id){q('#pn'+id).value='AI-demo: ehdotettu nimike';q('#pc'+id).value='TARKISTA-KOODI';alert('AI ehdottaa tuotteen – asentaja tarkistaa ennen myyntiä.')}function finish(id){let j=S.jobs.find(x=>x.id===id);j.km=q('#k'+id).value;if(!j.km)return alert('Syötä kilometrit');if(!j.st.every(x=>x[1]))return alert('Kuittaa kaikki työvaiheet');j.done=1;j.status='ready';save();jobs()}
function taskAudience(){return r==='m'?'Mikko':null}function tasks(){head('Tehtävät',r==='m'?'Sinulle annetut tehtävät':'Lisää ja seuraa tehtäviä');let aud=taskAudience(),ts=aud?S.tasks.filter(t=>t.a===aud):S.tasks;q('#V').innerHTML=`<div class="moduleHero tasks"><h3>✅ Tehtävät</h3><div class=mut>Vastuuhenkilöt, määräajat ja kuittaukset</div></div><div class=sectionTasks>${r!=='m'?`<div class=c><h3>Lisää tehtävä</h3><label>Vastaanottaja</label><select id=ta>${r==='w'?'<option>Mikko</option><option>Jari</option><option>Antti</option><option>Pekka</option>':'<option>Sami</option><option>Työnjohto</option><option>Mikko</option><option>Jari</option><option>Antti</option><option>Pekka</option>'}</select><div class=g><div><label>Aika</label><input id=tt type=time value=13:00></div><div><label>Prioriteetti</label><select id=tp><option>Normaali</option><option>Korkea</option></select></div></div><label>Tehtävä</label><input id=tx placeholder="Hoidettava asia"><button class=a style="width:100%;margin-top:9px" onclick=tadd()>+ Lisää tehtävä</button></div>`:''}<div class=c>${ts.map(t=>`<div class=task><div class=row style="justify-content:space-between"><div><b>${t.t} • ${esc(t.x)}</b><div class=mut>${esc(t.a)}</div></div><span class="tag ${t.d?'ok':t.late?'bad':'warn'}">${t.d?'Valmis':t.late?'Myöhässä':'Avoin'}</span></div>${!t.d&&((r==='m'&&t.a==='Mikko')||(r==='w'&&t.a==='Sami'))?`<button class=p style="margin-top:7px" onclick="td(${t.id})">Kuittaa hoidetuksi</button>`:''}</div>`).join('')||'<div class=mut>Ei tehtäviä</div>'}</div></div>`}function tadd(){let x=q('#tx').value.trim();if(!x)return alert('Kirjoita tehtävä');S.tasks.push({id:Date.now(),t:q('#tt').value,a:q('#ta').value,x,d:0,priority:q('#tp').value});save();tasks();alert('Tehtävä lisätty')}function td(id){S.tasks.find(t=>t.id===id).d=1;save();tasks()}
function board(){head('Kaikki tekijät','Työvuorot, varaukset ja tila yhdellä vilkaisulla');let es=['Mikko','Jari','Antti','Pekka'];q('#V').innerHTML=`<div class="moduleHero board"><h3>👥 Kaikki tekijät</h3><div class=mut>Työvuorot, varaukset ja tilat yhdellä silmäyksellä</div></div><div class=sectionBoard><div class=c><div class=g>${es.map(e=>personCard(e)).join('')}</div></div><div class=c><h3>Päivän aikajana</h3>${es.map(e=>`<div class=person><b>${e} • ${(S.sh[e]||['–','–']).join('–')}</b>${S.jobs.filter(j=>j.e===e).map(j=>`<div class="booking ${j.done?'ready':j.status==='work'?'work':'wait'}" style="margin-top:6px"><div class=row style="justify-content:space-between"><b>${j.s}–${j.f} • ${j.reg}</b>${statusTag(j)}</div><div class=mut>${j.wo} • ${j.c}</div></div>`).join('')||'<div class=mut style="margin-top:6px">Ei varauksia</div>'}</div>`).join('')}</div>`}
function personCard(e){let js=S.jobs.filter(j=>j.e===e),ready=js.filter(j=>j.done).length,work=js.filter(j=>!j.done&&j.status==='work').length,wait=js.length-ready-work,open=S.tasks.filter(t=>t.a===e&&!t.d).length;return `<div class=person><div class=row style="justify-content:space-between"><b>${e}</b><span class=tag>${(S.sh[e]||['–','–']).join('–')}</span></div><div class=row style="margin-top:7px"><span class="tag ok">Valmis ${ready}</span><span class=tag>Työn alla ${work}</span><span class="tag warn">Odottaa ${wait}</span>${open?`<span class="tag bad">Tehtäviä ${open}</span>`:''}</div></div>`}
function plan(){head('Ajanvaraukset','Työnjohto / esihenkilö');q('#V').innerHTML=`<div class="moduleHero calendar"><h3>📅 Ajanvaraukset & työvuorot</h3><div class=mut>Työkalenteri on erotettu omalle lämpimälle pohjalleen</div></div><div class=sectionCalendar><div class=c><label>Asentaja</label><select id=pe>${Object.keys(S.sh).map(e=>`<option>${e}</option>`).join('')}</select><div class=g><div><label>Alkaa</label><input id=ps type=time value=10:30></div><div><label>Päättyy</label><input id=pf type=time value=12:00></div></div><label>Asiakas</label><input id=pcus value="Testiasiakas Oy"><label>Työmääräin</label><input id=pwo value=TM-26460><label>Rek.nro</label><input id=preg value=ABC-123><label>Työvaiheet</label><textarea id=psteps rows=3>Vianhaku\nKorjaus\nKoeajo</textarea><button class=p style="width:100%;margin-top:10px" onclick=book()>Tallenna</button></div><div class=c><div class=stickyActions><button class=s onclick="go('board')">👥 Kaikkien näkymä</button><button class=a onclick=shiftform()>+ Työvuoro</button></div><h3 style="margin-top:12px">Työmääräimet ja tuoterivit</h3>${S.jobs.map(j=>`<div class=job><div class=row style="justify-content:space-between"><b>${j.wo} • ${j.reg} • ${j.e}</b>${statusTag(j)}</div><div class=mut>${j.c}</div>${(j.prod||[]).map(p=>`<div>${esc(p.code||p.name)} × ${p.qty}</div>`).join('')||'<div class=mut>Ei tuotteita</div>'}</div>`).join('')}</div>`}
function book(){let e=q('#pe').value,s=q('#ps').value,f=q('#pf').value,sh=S.sh[e];if(!sh||min(s)<min(sh[0])||min(f)>min(sh[1]))return alert('Ei mahdu työvuoroon '+(sh?sh.join('–'):'–'));if(S.jobs.find(j=>j.e===e&&!j.done&&min(s)<min(j.f)&&min(f)>min(j.s)))return alert('Päällekkäinen varaus');let st=q('#psteps').value.split('\n').filter(Boolean).map(x=>[x,0]);S.jobs.push({id:Date.now(),e,s,f,c:q('#pcus').value,reg:q('#preg').value,wo:q('#pwo').value,km:'',done:0,status:'wait',st,prod:[],pics:[]});save();plan();alert('Ajanvaraus lisätty')}
function shiftform(){q('#V').innerHTML=`<div class=c><h3>Muuta työvuoroa</h3><label>Asentaja</label><select id=se>${Object.keys(S.sh).map(e=>`<option>${e}</option>`).join('')}</select><div class=g><div><label>Alkaa</label><input id=ss type=time value=07:00></div><div><label>Päättyy</label><input id=sf type=time value=15:30></div></div><button class=p style="width:100%;margin-top:9px" onclick=ssave()>Tallenna</button></div>`}function ssave(){let e=q('#se').value,s=q('#ss').value,f=q('#sf').value,bad=S.jobs.find(j=>j.e===e&&!j.done&&(min(j.s)<min(s)||min(j.f)>min(f)));if(bad)return alert('Varaus '+bad.reg+' jäisi vuoron ulkopuolelle');S.sh[e]=[s,f];save();plan();alert('Työvuoro tallennettu')}
function sup(){head('Esihenkilön valvonta','Kaikki tekijät, tehtävät ja tuoterivit');let late=S.tasks.filter(t=>!t.d&&t.late).length,n=S.jobs.reduce((a,j)=>a+(j.prod||[]).length,0),open=S.tasks.filter(t=>!t.d).length;q('#V').innerHTML=`<div class="moduleHero super"><h3>🛡️ Esihenkilön valvonta</h3><div class=mut>Poikkeamat, avoimet tehtävät ja tuoterivit</div></div><div class=sectionSuper><div class=g3><div class=c><div class=mut>Myöhässä</div><h2>${late}</h2></div><div class=c><div class=mut>Avoimia tehtäviä</div><h2>${open}</h2></div><div class=c><div class=mut>Tuoterivejä</div><h2>${n}</h2></div></div><div class=c><div class=stickyActions><button class=p onclick="go('board')">👥 Kaikki tekijät</button><button class=a onclick="go('tasks')">+ Anna tehtävä</button><button class=s onclick="go('plan')">+ Ajanvaraus</button></div></div>`}
addEventListener('load',()=>{let x=localStorage.getItem(SE);if(x){r=x;q('#R').value=x;q('#L').classList.add('hide');q('#A').classList.remove('hide');v=r==='m'?'home':r==='w'?'board':'sup';build()}})
</script></body></html>
