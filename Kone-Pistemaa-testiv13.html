d var(--l);text-align:left;vertical-align:top}.table th{font-size:12px;color:var(--m)}.scroll{overflow:auto}.stickyActions{display:flex;gap:7px;flex-wrap:wrap}.compact h3{margin:0 0 6px}.moduleHero{border-radius:17px;padding:14px 15px;margin:8px 0 14px;border:1px solid var(--l)}.moduleHero h3{margin:0 0 3px}.moduleHero.jobs{background:var(--jobs-bg);border-left:6px solid var(--jobs-accent)}.moduleHero.calendar{background:var(--calendar-bg);border-left:6px solid var(--calendar-accent)}.moduleHero.tasks{background:var(--tasks-bg);border-left:6px solid var(--tasks-accent)}.moduleHero.super{background:var(--super-bg);border-left:6px solid var(--super-accent)}.moduleHero.products{background:var(--products-bg);border-left:6px solid var(--products-accent)}.moduleHero.board{background:var(--board-bg);border-left:6px solid var(--board-accent)}.sectionJobs{background:linear-gradient(180deg,var(--jobs-bg),#fff 180px);padding:10px;border-radius:18px}.sectionCalendar{background:linear-gradient(180deg,var(--calendar-bg),#fff 190px);padding:10px;border-radius:18px}.sectionTasks{background:linear-gradient(180deg,var(--tasks-bg),#fff 180px);padding:10px;border-radius:18px}.sectionSuper{background:linear-gradient(180deg,var(--super-bg),#fff 180px);padding:10px;border-radius:18px}.sectionBoard{background:linear-gradient(180deg,var(--board-bg),#fff 180px);padding:10px;border-radius:18px}.productPanel{background:var(--products-bg);border:1px solid #cfe3d7;border-radius:13px;padding:11px;margin-top:14px}.productPanel h3{color:var(--products-accent)}.cardTitleRow{display:flex;align-items:center;gap:8px;margin-bottom:8px}.iconBubble{width:31px;height:31px;border-radius:9px;display:grid;place-items:center;font-size:17px}.iconBubble.jobs{background:#d9eaf1}.iconBubble.calendar{background:#eee0ca}.iconBubble.tasks{background:#e7ddf1}.iconBubble.super{background:#dce7f1}.iconBubble.products{background:#dceee3}.nav button.on{background:#edf2f5;border-radius:9px}@media(max-width:650px){.g,.g3{gr <div id=L class=login><div class=c style="width:min(440px,100%)"><div class=logo>KP</div><h2>Kone Pistemaa</h2><div class=mut>Testiversio v13 • AI-inventointi</div><label>Käyttäjä</label><select id=R onchange=roleFields()><option value="m|Mikko">Mikko – Asentaja</option><option value="m|Jari">Jari – Asentaja</option><option value="m|Antti">Antti – Asentaja</option><option value="m|Pekka">Pekka – Asentaja</option><option value="w|Sami">Sami – Työnjohto</option><option value="s|Janne">Janne – Esihenkilö</option><option value="p|">Varaosahenkilöstö</option></select><div id=PX class=hide><label>Varaosahenkilön nimi</label><input id=PN placeholder="Kirjoita oma nimi"></div><button class=p style="width:100%;margin-top:12px" onclick=login()>Kirjaudu</button></div></div>

let S=JSON.parse(localStorage.getItem(K)||'null')||seed;
function migrate(){
 S.sh=S.sh||seed.sh;S.jobs=S.jobs||[];S.tasks=S.tasks||[];
 ['Mikko','Jari','Antti','Pekka'].forEach(e=>{if(!S.sh[e])S.sh[e]=seed.sh[e]});
 if(!S.jobs.some(j=>j.e==='Jari'))S.jobs.push(seed.jobs[2]);
 if(!S.tasks.some(t=>t.a==='Mikko'))S.tasks.push(seed.tasks[2]);
 if(!S.tasks.some(t=>t.a==='Jari'))S.tasks.push(seed.tasks[3]);
 S.jobs.forEach(j=>{
  j.status=j.done?'ready':(j.status||'wait');j.prod=j.prod||[];j.pics=j.pics||[];j.st=j.st||[];j.log=Array.isArray(j.log)?j.log:[];
  ['createdBy','createdAt','startedBy','startedAt','completedBy','completedAt'].forEach(k=>{if(j[k]==null)j[k]=''});
  j.st=j.st.map(x=>Array.isArray(x)?[x[0],x[1]?1:0,x[2]||'',x[3]||'']:[x.name||'',x.done?1:0,x.changedBy||'',x.changedAt||'']);
  j.prod.forEach(p=>{if(p.soldBy==null)p.soldBy='';if(p.soldAt==null)p.soldAt=''});
 });
 S.tasks.forEach(t=>{if(!t.a)t.a='Sami';['note','createdBy','createdAt','noteBy','noteAt','completedBy','completedAt'].forEach(k=>{if(t[k]==null)t[k]=''})});
 S.inventory=Array.isArray(S.inventory)?S.inventory:PRODUCTS.map(p=>({code:p.code,name:p.name,unit:p.unit,stock:0,min:0,lastBy:'',lastAt:'',lastMethod:''}));
 S.inventory.forEach(i=>{i.stock=Number(i.stock)||0;i.min=Number(i.min)||0;if(i.lastBy==null)i.lastBy='';if(i.lastAt==null)i.lastAt='';if(i.lastMethod==null)i.lastMethod=''});
 S.inventoryLog=Array.isArray(S.inventoryLog)?S.inventoryLog:[];
 S.partOrders=Array.isArray(S.partOrders)?S.partOrders:[];
 S.partOrders.forEach(o=>['createdBy','createdAt','receivedBy','receivedAt','deliveredBy','deliveredAt'].forEach(k=>{if(o[k]==null)o[k]=''}));
 save();
}
const q=x=>document.querySelector(x),save=()=>localStorage.setItem(K,JSON.stringify(S)),min=t=>{let[a,b]=t.split(':').map(Number);return a*60+b},esc=x=>String(x??'').replace(/[&<>]/g,a=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[a]));
const now=()=>new Date().toISOString(),actor=()=>u;
function fmt(x){if(!x)return '';let d=new Date(x);return Number.isNaN(d.getTime())?x:d.toLocaleString('fi-FI',{dateStyle:'short',timeStyle:'short'})}
function clock(x){if(!x)return '';let d=new Date(x);return Number.isNaN(d.getTime())?'':d.toLocaleTimeString('fi-FI',{hour:'2-digit',minute:'2-digit'})}
function logEvent(j,type,text){j.log=j.log||[];j.log.unshift({at:now(),by:actor(),type,text})}
function accountValue(x){return String(x||'').includes('|')?x:x==='w'?'w|Sami':x==='s'?'s|Janne':x==='p'?'p|Varaosat':'m|Mikko'}
function applyAccount(x){let y=accountValue(x);[r,u]=y.split('|');return y}
function initialView(){return r==='m'?'home':r==='w'?'board':r==='s'?'sup':'parts'}
migrate();
function roleFields(){let show=q('#R').value.startsWith('p|');q('#PX').classList[show?'remove':'add']('hide')}
function login(){let raw=q('#R').value;if(raw.startsWith('p|')){let name=q('#PN').value.trim();if(!name)return alert('Kirjoita varaosahenkilön nimi');raw='p|'+name}let x=applyAccount(raw);localStorage.setItem(SE,x);q('#L').classList.add('hide');q('#A').classList.remove('hide');v=initialView();build()}
function logout(){localStorage.removeItem(SE);q('#A').classList.add('hide');q('#L').classList.remove('hide')}
function items(){
 if(r==='m')return [['home','🏠 Etusivu'],['jobs','🔧 Työt'],['tasks','✅ Tehtävät']];
 if(r==='w')return [['board','📊 Toteuma'],['plan','📅 Ajanvaraus'],['tasks','✅ Omat tehtävät']];
 if(r==='p')return [['parts','📦 Varaosat']];
 return [['sup','🛡️ Valvonta'],['board','📊 Toteuma'],['plan','📅 Varaukset'],['tasks','✅ Tehtävät']];
}
function go(x){if(x==='tasks')tf='all';v=x;build()}
function taskfilter(f){tf=f;v='tasks';build()}
function build(){let active=v==='detail'?detailBack:v;q('#N').innerHTML=items().map(i=>`<button class="${active===i[0]?'on':''}" onclick="go('${i[0]}')">${i[1]}</button>`).join('');render()}
function head(a,b){q('#T').textContent=a;q('#U').textContent=b;document.body.dataset.view=v}
function render(){let fn=({home,jobs,tasks,plan,sup,board,parts,detail})[v];if(!fn)fn=({home,board,sup,parts})[initialView()]||home;fn()}
function statusTag(j){let st=j.done?'ready':j.status||'wait',txt=st==='work'?'Työn alla':st==='ready'?'Valmis':'Odottaa',cl=st==='ready'?'ok':st==='work'?'':'warn';return `<span class="tag ${cl}">${txt}</span>`}
function phaseProgress(j){let all=j.st.length,done=j.st.filter(x=>x[1]).length;return all?`${done}/${all} työvaihetta`:'Ei työvaiheita'}
function actualLine(j){if(j.done)return `Valmis${j.completedAt?' '+clock(j.completedAt):''}${j.completedBy?' • '+esc(j.completedBy):''}`;if(j.startedAt)return `Aloitettu ${clock(j.startedAt)}${j.startedBy?' • '+esc(j.startedBy):''}`;return 'Ei vielä aloitettu'}
function stepRows(j,editable){return j.st.map((x,i)=>`<div class=step><input type=checkbox ${x[1]?'checked':''} ${editable?'':'disabled'} onchange="st(${j.id},${i},this.checked)"><div class=stepInfo><b>${esc(x[0])}</b><div class=meta>${x[2]?`Viimeksi muutti ${esc(x[2])}${x[3]?' • '+fmt(x[3]):''}`:'Muuttajaa ei ole vielä kirjattu'}</div></div></div>`).join('')||'<div class=mut>Ei työvaiheita.</div>'}
function productRows(j){return (j.prod||[]).map(p=>`<div class=job><b>${esc(p.code||'–')} • ${esc(p.name)}</b><div>${p.qty} kpl</div><div class=meta>Myyjä: ${esc(p.soldBy||'Ei tallennettu – vanha tuoterivi')}${p.soldAt?' • '+fmt(p.soldAt):''}</div></div>`).join('')||'<div class=mut>Ei tuotteita.</div>'}
function productForm(j){return `<div class=productPanel><h3>Myy tuote työmääräimelle</h3><label>Tuotehaku</label><div class=row><input id=ps${j.id} placeholder="Hae koodilla tai nimikkeellä"><button class=s onclick="psearch(${j.id})">🔎 Hae</button></div><div id=pr${j.id}></div><div class=g><div><label>Koodi</label><input id=pc${j.id}></div><div><label>Nimike</label><input id=pn${j.id}></div><div><label>Määrä</label><input id=pq${j.id} type=number value=1 step=.01></div><div style="align-self:end"><button class=p style="width:100%" onclick="prod(${j.id})">+ Myy</button></div></div><label>Kuva tuotteesta/pakkauksesta</label><input type=file accept="image/*" capture=environment onchange="ppic(${j.id},this)">${j.pp?`<img class=photo src="${j.pp}"><button class=a onclick="aid(${j.id})">✨ AI-tuoteavustus (demo)</button>`:''}</div>`}
function home(){
 let sh=S.sh[u]||['–','–'],js=S.jobs.filter(j=>j.e===u),j=js.find(x=>!x.done)||js[0],mt=S.tasks.filter(t=>t.a===u&&!t.d);
 head('Omat työt',u+' • '+sh[0]+'–'+sh[1]);
 q('#V').innerHTML=`<div class="moduleHero jobs"><h3>🔧 Asentajan työpäivä</h3><div class=mut>Työvuoro, seuraava työ ja omat tehtävät</div></div><div class=sectionJobs><div class=c>${j?`<div class=mut>Seuraava työ</div><h3>${j.s}–${j.f} • ${j.reg}</h3><b>${j.c}</b><div class=row style="margin-top:6px"><span class=tag>${j.wo}</span>${statusTag(j)}</div><button class=p style="margin-top:10px" onclick="go('jobs')">Avaa työ</button>`:'<div class=mut>Ei varattuja töitä.</div>'}</div><div class=c><h3>Omat tehtävät</h3>${mt.map(t=>`<div class=task><b>${t.t} • ${esc(t.x)}</b>${t.note?`<div class=agreement><b>Sovittu</b><div>${esc(t.note)}</div></div>`:''}<button class=p style="margin-top:7px" onclick="td(${t.id})">Kuittaa • ${esc(u)}</button></div>`).join('')||'<div class=mut>Ei avoimia tehtäviä</div>'}</div></div>`;
}
function jobEditor(j){let editable=!j.done;return `<div class=c><div class=row style="justify-content:space-between"><div><h3>${j.reg} • ${j.wo}</h3><div class=mut>${j.c} • ${j.s}–${j.f}</div></div>${statusTag(j)}</div>${editable&&j.status!=='work'?`<button class=a onclick="startjob(${j.id})">▶ Aloita työ nimellä ${esc(actor())}</button>`:''}<label>Kilometrit *</label><input id=k${j.id} type=number value="${j.km||''}" ${j.done?'disabled':''}><h3>Työvaiheet</h3>${stepRows(j,editable)}${editable?`<div class=row><input id=ns${j.id} placeholder="Lisää työvaihe"><button class=a onclick="addst(${j.id})">+ vaihe</button></div>`:''}<h3 style="margin-top:16px">Tuotteet</h3>${productRows(j)}${productForm(j)}<h3>📷 Vauriokuvat</h3><input type=file accept="image/*" capture=environment onchange="pic(${j.id},this)">${(j.pics||[]).map(x=>`<img class=photo src="${x}">`).join('')}<button class=p style="width:100%;margin-top:12px" ${j.done?'disabled':''} onclick="finish(${j.id})">✓ Kuittaa työ valmiiksi • ${esc(actor())}</button>${j.done?`<div class=meta>Työn kuittasi ${esc(j.completedBy||'Ei tallennettu – vanha kuittaus')}${j.completedAt?' • '+fmt(j.completedAt):''}</div>`:''}</div>`}
function jobs(){head('Varatut työt',u+' • työmääräimet ja kuittaukset');let js=S.jobs.filter(j=>j.e===u);q('#V').innerHTML=`<div class="moduleHero jobs"><h3>🔧 Varatut työt</h3><div class=mut>Työvaiheet, tuotteet, kuvat ja tekijätiedot</div></div><div class=sectionJobs>${js.map(jobEditor).join('')||'<div class=c><div class=mut>Ei varattuja töitä.</div></div>'}</div>`}

function st(id,i,x){let j=S.jobs.find(j=>j.id===id);if(!j||!j.st[i])return;let at=now();j.st[i][1]=x?1:0;j.st[i][2]=actor();j.st[i][3]=at;logEvent(j,'Työvaihe',`${j.st[i][0]}: ${x?'kuitattu valmiiksi':'palautettu keskeneräiseksi'}`);jobRefresh()}

function partOrderRows(){return S.partOrders.slice().reverse().map(o=>{let j=S.jobs.find(j=>j.id===o.jobId);return `<div class=job><div class=row style="justify-content:space-between"><b>${esc(o.code)} • ${esc(o.name)}</b>${orderStatus(o)}</div><div>${o.qty} kpl${j?' • '+esc(j.wo)+' / '+esc(j.reg):' • Viikkotilaus'}</div><div class=meta>Tilasi ${esc(o.createdBy||'Ei nimeä')}${o.createdAt?' • '+fmt(o.createdAt):''}</div>${o.receivedBy?`<div class=meta>Vastaanotti ja kirjasi sisään ${esc(o.receivedBy)}${o.receivedAt?' • '+fmt(o.receivedAt):''}</div>`:''}${o.deliveredBy?`<div class=meta>Toimitti työmääräimelle ${esc(o.deliveredBy)}${o.deliveredAt?' • '+fmt(o.deliveredAt):''}</div>`:''}<div class=stickyActions style="margin-top:7px">${o.status==='Tilattu'?`<button class=a onclick="receiveorder(${o.id})">Vastaanota ja kirjaa sisään</button>`:''}${o.status==='Vastaanotettu'&&j?`<button class=p onclick="deliverorder(${o.id})">Toimita ${esc(j.wo)}:lle</button>`:''}</div></div>`}).join('')||'<div class=mut>Ei varaosatilauksia.</div>'}
function compactCode(x){return String(x||'').toUpperCase().replace(/[^A-Z0-9]/g,'')}
function parseInventoryText(text){
 let raw=String(text||'').replace(/\r/g,''),lines=raw.split('\n').map(x=>x.trim()).filter(Boolean),joined=lines.join(' '),compactAll=compactCode(joined);
 let item=S.inventory.find(i=>{let c=compactCode(i.code);return c.length>=3&&compactAll.includes(c)}),code=item?item.code:'';
 if(!code){let tokens=joined.toUpperCase().match(/[A-ZÅÄÖ0-9][A-ZÅÄÖ0-9._/-]{3,}/g)||[];code=tokens.find(t=>{let c=compactCode(t);if(['QTY','QUANTITY','MAARA','KAPPALEMAARA','KPL','PCS','STK'].includes(c))return false;return(/[A-ZÅÄÖ]/.test(t)&&/\d/.test(t)&&c.length>=4)||/^\d{5,}$/.test(c)})||''}
 let qty=1,qtyFound=false,patterns=[/(?:^|\s)(?:QTY|QUANTITY|MÄÄRÄ|MAARA|KAPPALEMÄÄRÄ|KAPPALEMAARA|KPL|PCS|STK|ST|EA)\s*[:=#-]?\s*(\d+(?:[.,]\d+)?)/i,/(\d+(?:[.,]\d+)?)\s*(?:KPL|PCS|STK|ST|EA)\b/i];
 for(let p of patterns){let m=joined.match(p);if(m){qty=Number(m[1].replace(',','.'));qtyFound=Number.isFinite(qty);if(qtyFound)break}}
 let name=item?item.name:'';
 if(!name){let cc=compactCode(code),candidates=lines.filter(l=>{let up=l.toUpperCase();return/[A-ZÅÄÖ]/i.test(l)&&l.length>=3&&(!cc||!compactCode(l).includes(cc))&&!/(?:QTY|QUANTITY|MÄÄRÄ|MAARA|KPL|PCS|STK)\b/i.test(up)});name=candidates.sort((a,b)=>(b.match(/[A-ZÅÄÖ]/gi)||[]).length-(a.match(/[A-ZÅÄÖ]/gi)||[]).length||b.length-a.length)[0]||''}
 return{code,name,qty:qtyFound?qty:1,qtyFound,matchedExisting:!!item,raw};
}
function aiInventoryLog(){return S.inventoryLog.slice().reverse().slice(0,5).map(x=>`<div class=auditItem><b>${esc(x.code)} • ${esc(x.name)}</b><div>${x.mode==='add'?`Lisätty ${x.qty}, saldo ${x.before} → ${x.after}`:`Inventoitu saldo ${x.before} → ${x.after}`}</div><div class=meta>${esc(x.by)} • ${fmt(x.at)} • AI/OCR</div></div>`).join('')||'<div class=mut>Ei vielä AI-inventointeja.</div>'}
function aiInventoryPanel(){return `<div class=c><div class=aiPanel><h3>✨ AI-inventointi kameralla</h3><div class=mut>Ota selkeä kuva pakkauksen tekstistä ja kappalemäärästä. AI täyttää tiedot, mutta saldo muuttuu vasta hyväksymisen jälkeen.</div><label>Kuva tuotteesta tai hyllylapusta</label><input id=aiPic type=file accept="image/*" capture=environment onchange="inventoryPhoto(this)"><img id=aiPreview class="photo aiPreview hide" alt="Inventointikuva"><div id=aiStatus class="aiStatus mut">Ota kuva tai valitse kuva puhelimesta.</div><button id=aiRead class=a style="width:100%" onclick=aiReadInventory()>✨ Lue tuote ja kappalemäärä</button><div id=aiResult class="aiResult hide"><div id=aiConfidence class=meta></div><div class=g><div><label>Tuotenumero</label><input id=aiCode placeholder="Tarkista tuotenumero"></div><div><label>Nimike</label><input id=aiName placeholder="Tarkista nimike"></div><div><label>Kappalemäärä</label><input id=aiQty type=number step=.01 min=0></div><div><label>Saldon päivitys</label><select id=aiMode><option value=set>Aseta inventoitu saldo</option><option value=add>Lisää nykyiseen saldoon</option></select></div></div><label>Luettu teksti</label><textarea id=aiRaw rows=4 readonly></textarea><button class=p style="width:100%;margin-top:9px" onclick=saveAiInventory()>Hyväksy ja päivitä saldo • ${esc(actor())}</button></div></div><h3>Viimeisimmät AI-inventoinnit</h3><div class=audit>${aiInventoryLog()}</div></div>`}

function ocrProgress(m){let status=q('#aiStatus');if(!status)return;let labels={'loading tesseract core':'Valmistellaan lukijaa','initializing tesseract':'Käynnistetään tekstinlukua','loading language traineddata':'Ladataan kielimallia','initializing api':'Viimeistellään lukijaa','recognizing text':'Luetaan tekstiä kuvasta'},label=labels[m.status]||'Käsitellään kuvaa',pct=typeof m.progress==='number'?' '+Math.round(m.progress*100)+' %':'';status.textContent=label+pct}
async function aiReadInventory(){
 let status=q('#aiStatus'),button=q('#aiRead');if(!inventoryImage)return alert('Ota ensin kuva tuotteesta tai hyllylapusta');
 if(typeof Tesseract==='undefined'){if(status)status.textContent='AI-lukijaa ei voitu ladata. Tarkista internetyhteys ja yritä uudelleen.';return}
 try{if(button)button.disabled=true;if(status)status.textContent='Valmistellaan AI-lukua…';if(!ocrWorker)ocrWorker=await Tesseract.createWorker(['fin','eng'],1,{logger:ocrProgress});let ret=await ocrWorker.recognize(inventoryImage),text=ret&&ret.data?ret.data.text||'':'',confidence=ret&&ret.data&&Number.isFinite(ret.data.confidence)?Math.round(ret.data.confidence):null,parsed=parseInventoryText(text),result=q('#aiResult');if(!q('#aiCode'))return;q('#aiCode').value=parsed.code;q('#aiName').value=parsed.name;q('#aiQty').value=parsed.qty;q('#aiRaw').value=parsed.raw;q('#aiConfidence').textContent=`OCR-varmuus: ${confidence==null?'ei saatavilla':confidence+' %'}${parsed.matchedExisting?' • Tuote löytyi varastosta':''}${parsed.qtyFound?'':' • Kappalemäärää ei tunnistettu, oletus 1'}`;if(result)result.classList.remove('hide');if(status)status.textContent='Luku valmis. Tarkista tuotenumero ja kappalemäärä ennen hyväksymistä.'}
 catch(e){if(status)status.textContent='Kuvan lukeminen epäonnistui. Ota tarkempi kuva hyvässä valossa ja yritä uudelleen.'}
 finally{button=q('#aiRead');if(button)button.disabled=false}
}
function saveAiInventory(){if(r!=='p')return;let code=q('#aiCode').value.trim(),name=q('#aiName').value.trim(),qty=+q('#aiQty').value,mode=q('#aiMode').value;if(!code||!Number.isFinite(qty)||qty<0)return alert('Tarkista tuotenumero ja kappalemäärä');let item=S.inventory.find(i=>compactCode(i.code)===compactCode(code)),at=now();if(!item){item={code,name:name||'Nimike tarkistettava',unit:'kpl',stock:0,min:0,lastBy:'',lastAt:'',lastMethod:''};S.inventory.push(item)}else if(name)item.name=name;let before=Number(item.stock)||0;item.stock=mode==='add'?before+qty:qty;item.lastBy=actor();item.lastAt=at;item.lastMethod='AI/OCR-inventointi';S.inventoryLog.push({id:Date.now(),code:item.code,name:item.name,qty,before,after:item.stock,mode,by:actor(),at});if(S.inventoryLog.length>100)S.inventoryLog=S.inventoryLog.slice(-100);save();inventoryImage='';parts();alert('AI-inventointi tallennettu')}
function inventoryRows(){return S.inventory.map((i,n)=>`<div class=job><b>${esc(i.code)} • ${esc(i.name)}</b><div class=g><div><label>Varastosaldo</label><input id=is${n} type=number step=.01 value="${i.stock}"></div><div><label>Hälytysraja</label><input id=im${n} type=number step=.01 value="${i.min}"></div></div><button class=s style="margin-top:7px" onclick="invsave(${n})">Tallenna inventointi • ${esc(actor())}</button>${i.lastBy?`<div class=meta>Viimeksi kirjasi ${esc(i.lastBy)}${i.lastAt?' • '+fmt(i.lastAt):''}${i.lastMethod?' • '+esc(i.lastMethod):''}</div>`:''}</div>`).join('')}
function parts(){
 let low=S.inventory.filter(i=>i.stock<i.min);
 head('Varaosat',actor()+' • tilaukset, vastaanotto, inventointi ja toimitukset');
 q('#V').innerHTML=`<div class="moduleHero products"><h3>📦 Varaosahenkilöstön työjono</h3><div class=mut>Tilaukset työmääräimille, viikkotilaukset, tavaran vastaanotto, sisäänkirjaus, inventointi ja myynti</div></div><div class=sectionJobs><div class=c><h3>Työmääräimet ja myynti</h3><div class=mut>Avaa työmääräin. Tuotteen myyjän nimi tallentuu aina.</div>${S.jobs.slice().sort((a,b)=>a.done-b.done).map(j=>bookingSlot(j,'parts')).join('')||'<div class=mut>Ei työmääräimiä.</div>'}</div><div class=c><h3>Tilaa osa työmääräimelle</h3><label>Työmääräin</label><select id=oj>${S.jobs.filter(j=>!j.done).map(j=>`<option value="${j.id}">${esc(j.wo)} • ${esc(j.reg)} • ${esc(j.c)}</option>`).join('')}</select><div class=g><div><label>Tuotekoodi</label><input id=oc placeholder="Tuotekoodi"></div><div><label>Nimike</label><input id=on placeholder="Nimike"></div><div><label>Määrä</label><input id=oq type=number step=.01 value=1></div></div><button class=p style="width:100%;margin-top:9px" onclick=partorder()>Tee tilaus • ${esc(actor())}</button></div><div class=c><h3>Tilaukset, vastaanotto ja toimitus</h3>${partOrderRows()}</div>${aiInventoryPanel()}<div class=c><div class=row style="justify-content:space-between"><div><h3 style="margin:0">Inventointi ja viikkotilaus</h3><div class=mut>${low.length} tuotetta alle hälytysrajan</div></div><button class=a onclick=weeklyorder()>Luo viikkotilaus</button></div>${inventoryRows()}</div></div>`;
}
function partorder(){if(r!=='p')return;let jobId=+q('#oj').value,code=q('#oc').value.trim(),name=q('#on').value.trim(),qty=+q('#oq').value;if(!jobId||(!code&&!name)||!qty)return alert('Täytä työmääräin, tuote ja määrä');S.partOrders.push({id:Date.now(),jobId,code,name:name||'Nimike tarkistettava',qty,status:'Tilattu',type:'work',createdBy:actor(),createdAt:now(),receivedBy:'',receivedAt:'',deliveredBy:'',deliveredAt:''});save();parts();alert('Osa tilattu työmääräimelle')}
function invsave(n){if(r!=='p')return;let i=S.inventory[n],stock=+q('#is'+n).value,minv=+q('#im'+n).value;if(!i||stock<0||minv<0)return alert('Saldo ja hälytysraja eivät voi olla negatiivisia');i.stock=stock;i.min=minv;i.lastBy=actor();i.lastAt=now();i.lastMethod='Manuaalinen inventointi';save();parts()}
function weeklyorder(){if(r!=='p')return;let low=S.inventory.filter(i=>i.stock<i.min);if(!low.length)return alert('Yksikään tuote ei ole alle hälytysrajan');let base=Date.now();low.forEach((i,n)=>S.partOrders.push({id:base+n,jobId:null,code:i.code,name:i.name,qty:i.min-i.stock,status:'Tilattu',type:'weekly',createdBy:actor(),createdAt:now(),receivedBy:'',receivedAt:'',deliveredBy:'',deliveredAt:''}));save();parts();alert('Viikkotilaus luotu')}
function receiveorder(id){if(r!=='p')return;let o=S.partOrders.find(o=>o.id===id);if(!o||o.status!=='Tilattu')return;let i=S.inventory.find(i=>i.code===o.code);if(!i){i={code:o.code,name:o.name,unit:'kpl',stock:0,min:0,lastBy:'',lastAt:'',lastMethod:''};S.inventory.push(i)}i.stock+=Number(o.qty);i.lastBy=actor();i.lastAt=now();i.lastMethod='Tavaran vastaanotto';o.status='Vastaanotettu';o.receivedBy=actor();o.receivedAt=now();save();parts();alert('Tavara vastaanotettu ja kirjattu sisään')}
function deliverorder(id){if(r!=='p')return;let o=S.partOrders.find(o=>o.id===id),j=o&&S.jobs.find(j=>j.id===o.jobId),i=o&&S.inventory.find(i=>i.code===o.code);if(!o||!j||o.status!=='Vastaanotettu')return;if(!i||i.stock<o.qty)return alert('Varastosaldo ei riitä toimitukseen');i.stock-=Number(o.qty);i.lastBy=actor();i.lastAt=now();i.lastMethod='Toimitus työmääräimelle';let at=now();j.prod.push({code:o.code,name:o.name,qty:o.qty,soldBy:actor(),soldAt:at,source:'Varaosatoimitus'});logEvent(j,'Varaosatoimitus',`${o.code||o.name} × ${o.qty} toimitettu työmääräimelle`);o.status='Toimitettu';o.deliveredBy=actor();o.deliveredAt=at;save();parts();alert('Osa toimitettu työmääräimelle')}
function sup(){
head('Esihenkilön valvonta','Työnjohdolle annettujen tehtävien tilanne');
let managed=S.tasks.filter(t=>t.a==='Sami'||t.a==='Työnjohto'),ready=managed.filter(t=>t.d).length,
late=managed.filter(t=>!t.d&&t.late).length,
open=managed.filter(t=>!t.d&&!t.late).length;
q('#V').innerHTML=`<div class="moduleHero super"><h3>🛡️ Esihenkilön valvonta</h3><div class=mut>Paina tilakorttia nähdäksesi työnjohdolle annetut tehtävät</div></div><div class=sectionSuper><div class=g3>
<button class=c style="text-align:left;cursor:pointer" onclick="taskfilter('done')"><div class=mut>Valmis</div><h2 style="margin:5px 0">${ready}</h2><span class="tag ok">Avaa valmiit →</span></button>
<button class=c style="text-align:left;cursor:pointer" onclick="taskfilter('late')"><div class=mut>Myöhässä</div><h2 style="margin:5px 0">${late}</h2><span class="tag bad">Avaa myöhässä →</span></button>
<button class=c style="text-align:left;cursor:pointer" onclick="taskfilter('open')"><div class=mut>Kesken</div><h2 style="margin:5px 0">${open}</h2><span class="tag warn">Avaa keskeneräiset →</span></button>
</div><div class=c><div class=stickyActions><button class=p onclick="go('board')">📊 Toteuma</button><button class=a onclick="go('tasks')">+ Anna tehtävä työnjohdolle</button><button class=s onclick="go('plan')">📅 Katso varaukset</button></div></div></div>`}
addEventListener('load',()=>{let x=localStorage.getItem(SE);if(x){let y=applyAccount(x);if(r==='p'){q('#R').value='p|';q('#PN').value=u;roleFields()}else q('#R').value=y;q('#L').classList.add('hide');q('#A').classList.remove('hide');v=initialView();build()}})
</script></body></html>
